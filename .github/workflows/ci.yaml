name: CI

# Run CI for every pushed commit and every pull request.
on:
  push:
  pull_request:

# Production additionally publishes packages and commits the deployment image.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub-hosted runner.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install the same Java version configured in pom.xml and cache Maven files.
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compile and run the test suite with Maven Surefire.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      #snyk setup
      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Scan Maven dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high

  build:
    # Build only after all tests have passed.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Package the application without repeating the tests from the previous job.
      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

  deploy-dev:
    # Simulate deployment only after the build succeeds.
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Fake deployment to development
        run: |
          echo "Starting fake deployment to development..."
          echo "No application or infrastructure is being changed."
          echo "Fake development deployment completed successfully."

  deploy-production:
    # Production runs on Docker Desktop Kubernetes after approval and dev deployment.
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, local-kubernetes]
    environment: Production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify local deployment tools
        run: |
          docker info
          kubectl --context docker-desktop cluster-info

      - name: Set GHCR image reference
        shell: bash
        run: |
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=ghcr.io/${IMAGE_OWNER}/aireconsile:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build production Docker image
        run: |
          docker build \
            --tag "aireconsile:${GITHUB_SHA}" \
            --tag "$GHCR_IMAGE" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      # Block deployment if the image has high or critical vulnerabilities.
      - name: Scan production Docker image
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test "aireconsile:${GITHUB_SHA}" --file=Dockerfile --severity-threshold=high

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish production Docker image
        run: docker push "$GHCR_IMAGE"

      # GITHUB_TOKEN pushes do not trigger another CI run.
      - name: Commit published image to Git
        shell: bash
        run: |
          git fetch origin master
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::master has advanced. Run deployment from the latest master commit."
            exit 1
          fi

          kubectl set image --local -f k8s/deployment.yaml \
            "aireconsile=${GHCR_IMAGE}" -o yaml \
            > "${RUNNER_TEMP}/gitops-deployment.yaml"
          cp "${RUNNER_TEMP}/gitops-deployment.yaml" k8s/deployment.yaml

          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "Deployment already references the published image."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Deploy aireconsile image ${GITHUB_SHA}"
          # A normal push rejects concurrent changes; never force-push or rebase an old image.
          git push origin HEAD:refs/heads/master

      - name: Create Kubernetes namespace
        run: kubectl --context docker-desktop apply -f k8s/namespace.yaml

      - name: Deploy to Docker Desktop Kubernetes
        run: |
          # Keep using the local image until deployment moves to Argo CD.
          kubectl set image --local -f k8s/deployment.yaml \
            "aireconsile=aireconsile:${GITHUB_SHA}" -o yaml \
            > "${RUNNER_TEMP}/deployment.yaml"

          kubectl --context docker-desktop apply \
            -f k8s/persistent-volume-claim.yaml \
            -f "${RUNNER_TEMP}/deployment.yaml" \
            -f k8s/service.yaml

          kubectl --context docker-desktop \
            --namespace aireconsile \
            rollout status deployment/aireconsile \
            --timeout=180s

      - name: Test deployed health endpoint
        run: |
          kubectl --context docker-desktop \
            --namespace aireconsile \
            port-forward service/aireconsile 18080:8080 \
            > "${RUNNER_TEMP}/aireconsile-port-forward.log" 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID"' EXIT

          curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:18080/actuator/health
