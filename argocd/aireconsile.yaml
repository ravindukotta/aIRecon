apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aireconsile
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ravindukotta/aIRecon.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aireconsile
  # Manual sync while GitHub Actions still deploys directly to Kubernetes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
