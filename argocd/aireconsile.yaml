apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aireconsile
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ravindukotta/aIRecon.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aireconsile
  # Argo CD deploys Git changes and restores configuration drift.
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
